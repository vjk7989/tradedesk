[project]
name = "bt-service"
version = "0.1.0"
description = "Standalone backtest service built on the Vibe-Trading engine (MIT)"
requires-python = ">=3.11"
dependencies = [
    "pandas<4",
    "numpy",
    "scipy",
    "pydantic",
    "yfinance",
    "ccxt",
    "fastapi",
    "uvicorn",
    "httpx",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibe_bt", "bt_service"]
