version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/trade-mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      trade-mcp-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/agent-runner"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      agent-runner-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "uv"
    directory: "/bt-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      bt-service-minor-patch:
        update-types: ["minor", "patch"]
