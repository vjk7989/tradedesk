services:
  openalgo:
    build:
      context: ${OPENALGO_SRC:-../vendor/openalgo}
      dockerfile: Dockerfile
    image: openalgo:latest
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - TZ=Asia/Kolkata
    volumes:
      - openalgo_db:/app/db
      - openalgo_log:/app/log
      - openalgo_strategies:/app/strategies
      - openalgo_keys:/app/keys
      - openalgo_tmp:/app/tmp
      - type: bind
        source: ${OPENALGO_ENV_FILE:-./openalgo.env}
        target: /app/.env
        bind:
          create_host_path: false
    shm_size: 512m
    expose: ["5000", "8765"]
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/auth/check-setup"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  trade-mcp:
    build:
      context: ../trade-mcp
    environment:
      OPENALGO_URL: http://openalgo:5000
      OPENALGO_API_KEY: ${OPENALGO_API_KEY:?set OPENALGO_API_KEY}
      MCP_TOKEN: ${MCP_TOKEN:?set MCP_TOKEN}
      MCP_TOKEN_READONLY: ${MCP_TOKEN_READONLY:-}
      EXECUTE_TIMEOUT_MS: ${EXECUTE_TIMEOUT_MS:-60000}
      EXECUTE_MAX_CONCURRENT: ${EXECUTE_MAX_CONCURRENT:-4}
      EXECUTE_MEMORY_MB: ${EXECUTE_MEMORY_MB:-64}
      OAUTH_ENABLED: ${OAUTH_ENABLED:-0}
      OAUTH_ISSUER_URL: ${OAUTH_ISSUER_URL:-}
      OAUTH_PASSWORD_HASH: ${OAUTH_PASSWORD_HASH:-}
      OAUTH_ALLOWED_REDIRECT_HOSTS: ${OAUTH_ALLOWED_REDIRECT_HOSTS:-chatgpt.com,claude.ai,claude.com}
      BT_URL: http://bt-service:8000
      BT_TOKEN: ${BT_TOKEN:?set BT_TOKEN}
      MODE: ${MODE:-paper}
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /data
      RISK_CONFIG: /config/risk.json
    volumes:
      - trade_mcp_data:/data
      - type: bind
        source: ${RISK_CONFIG_FILE:-./risk.example.json}
        target: /config/risk.json
        read_only: true
    mem_limit: ${TRADE_MCP_MEM_LIMIT:-1g}
    memswap_limit: ${TRADE_MCP_MEM_LIMIT:-1g}
    expose: ["8787"]
    networks: [internal]
    depends_on: [openalgo, bt-service]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  bt-service:
    build:
      context: ../bt-service
    environment:
      BT_TOKEN: ${BT_TOKEN:?set BT_TOKEN}
      OPENALGO_URL: http://openalgo:5000
      OPENALGO_API_KEY: ${OPENALGO_API_KEY:?set OPENALGO_API_KEY}
      BT_RUNS_DIR: /runs
    tmpfs:
      - /runs
    mem_limit: ${BT_MEM_LIMIT:-1g}
    memswap_limit: ${BT_MEM_LIMIT:-1g}
    cpus: ${BT_CPUS:-1}
    expose: ["8000"]
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  paper-bot:
    build:
      context: ../paper-bot
    environment:
      SYMBOLS: ${SYMBOLS:-BTCUSD}
      RESOLUTION: ${RESOLUTION:-5m}
      INTERVAL_SEC: ${INTERVAL_SEC:-60}
      FAST: ${FAST:-9}
      SLOW: ${SLOW:-21}
      ALLOW_SHORT: ${ALLOW_SHORT:-0}
      NOTIONAL_USD: ${NOTIONAL_USD:-1000}
      START_CAPITAL_USD: ${START_CAPITAL_USD:-10000}
      TAKER_FEE: ${TAKER_FEE:-0.0005}
      SLIPPAGE: ${SLIPPAGE:-0.0002}
      DELTA_BASE_URL: ${DELTA_BASE_URL:-https://api.india.delta.exchange}
    volumes:
      - paper_bot_data:/data
    mem_limit: ${PAPER_BOT_MEM_LIMIT:-256m}
    memswap_limit: ${PAPER_BOT_MEM_LIMIT:-256m}
    networks: [internal, egress]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      DASH_USER: ${DASH_USER:-admin}
      # Default is a valid bcrypt hash of a discarded random secret: dashboard is locked until the operator sets their own.
      DASH_PASSWORD_HASH: ${DASH_PASSWORD_HASH:-$$2b$$12$$limWPi5G0rGNHgYTSHGcme4PGfdr8lAwWHAeJHj6LX9nbmiwq0fMa}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, public]
    depends_on: [trade-mcp, openalgo, paper-bot]
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    memswap_limit: ${CADDY_MEM_LIMIT:-128m}
    restart: unless-stopped

networks:
  internal:
    internal: true
  egress: {}
  public: {}

volumes:
  openalgo_db:
  openalgo_log:
  openalgo_strategies:
  openalgo_keys:
  openalgo_tmp:
  trade_mcp_data:
  paper_bot_data:
  caddy_data:
  caddy_config:
